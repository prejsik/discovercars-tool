<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ceny i rynek: przed i po</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:15px/1.5 system-ui,sans-serif;color:#171a20;background:#f4f5f7}main{max-width:1800px;margin:auto}h1{font-size:24px;margin:0 0 6px}p{margin:0 0 20px;color:#535b68}nav{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:16px 0}label{display:flex;gap:8px;align-items:center}select{padding:8px;border:1px solid #c9ced6;border-radius:4px;background:white;font:inherit}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;min-width:0}figcaption{font-size:18px;font-weight:600;margin-bottom:8px}img{display:block;width:100%;height:auto;border:1px solid #d7dce2}.comparison.mobile{max-width:820px;margin:auto}.comparison.mobile img{max-width:390px}a{color:#154dbb}@media(max-width:700px){body{padding:16px}.comparison{grid-template-columns:1fr}h1{font-size:21px}}
</style>
<main>
<h1>Ceny i rynek: przed i po</h1>
<p>Te same dane testowe po obu stronach. Zrzuty z lokalnego panelu, nie z produkcji. Ceny są przykładowe.</p>
<nav aria-label="Wybór porównania">
<label>Widok <select id="view"><option value="map">Mapa</option><option value="band-detail">Oddział z panelem pasma</option><option value="calendar">Kalendarz</option><option value="excel">Stawki w Excelu</option></select></label>
<label>Ekran <select id="width"><option value="1440">Desktop 1440 × 1000</option><option value="390">Telefon 390 × 844</option></select></label>
</nav>
<div class="comparison" id="comparison">
<figure><figcaption>Przed</figcaption><a id="before-link" href="verification/before/map-1440.png"><img id="before" src="verification/before/map-1440.png" alt="Mapa przed zmianą, desktop"></a></figure>
<figure><figcaption>Po</figcaption><a id="after-link" href="verification/after/map-1440.png"><img id="after" src="verification/after/map-1440.png" alt="Mapa po zmianie, desktop"></a></figure>
</div>
</main>
<script>
const view=document.getElementById('view'),width=document.getElementById('width');
function update(){
 document.getElementById('comparison').classList.toggle('mobile',width.value==='390');
 for(const state of ['before','after']){
  const path=`verification/${state}/${view.value}-${width.value}.png`;
  document.getElementById(state).src=path;
  document.getElementById(state).alt=`${view.selectedOptions[0].text}, ${state==='before'?'przed':'po'}, ${width.value} px`;
  document.getElementById(state+'-link').href=path;
 }
}
view.addEventListener('change',update);width.addEventListener('change',update);
</script>
</html>
