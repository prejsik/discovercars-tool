name: DiscoverCars regression tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'input/**'
      - '*.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovercars-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Install Playwright Chromium
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=15s 180s npx playwright install chromium; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1
      - run: npm run test:all
